name: Android APKs

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      # Restore + build while the network is still available (NuGet needs it).
      - name: Build test projects
        run: |
          dotnet build PrayerTimeEngine.Core.Tests.Unit/PrayerTimeEngine.Core.Tests.Unit.csproj -c Release
          dotnet build PrayerTimeEngine.Core.Tests.Integration/PrayerTimeEngine.Core.Tests.Integration.csproj -c Release

      # Run tests with outbound network blocked, so any test that tries to reach a
      # live API fails immediately instead of silently passing. Existing (runner)
      # connections and loopback stay open; new outbound connections are rejected.
      # The intentional live-API tests (named *WithLiveApi*) are excluded here on
      # purpose; the block then only catches tests that reach the network by mistake.
      - name: Run tests offline
        run: |
          sudo iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -j REJECT
          trap 'sudo iptables -F OUTPUT' EXIT
          dotnet test PrayerTimeEngine.Core.Tests.Unit/PrayerTimeEngine.Core.Tests.Unit.csproj \
            -c Release --no-build --filter "FullyQualifiedName!~WithLiveApi" \
            --logger "trx;LogFileName=unit.trx" --results-directory TestResults
          dotnet test PrayerTimeEngine.Core.Tests.Integration/PrayerTimeEngine.Core.Tests.Integration.csproj \
            -c Release --no-build --filter "FullyQualifiedName!~WithLiveApi" \
            --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: .NET Tests
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/*.trx
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"

      - name: Build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: >
          dotnet build PrayerTimeEngine.MAUI/PrayerTimeEngine.MAUI.csproj
          -c Debug -f net10.0-android -t:SignAndroidPackage
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/signing.keystore"
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}'
          -p:AndroidSigningStorePass='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'

      - name: Build Release APK
        run: >
          dotnet publish PrayerTimeEngine.MAUI/PrayerTimeEngine.MAUI.csproj
          -c Release -f net10.0-android
          -p:EnableLLVM=false
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/signing.keystore"
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}'
          -p:AndroidSigningStorePass='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'

      - name: Collect APKs
        run: |
          mkdir -p out
          cp PrayerTimeEngine.MAUI/bin/Debug/net10.0-android/*-Signed.apk \
             "out/PrayerTimeEngine_${BUILD_DATE}_debug.apk"
          cp PrayerTimeEngine.MAUI/bin/Release/net10.0-android/*-Signed.apk \
             "out/PrayerTimeEngine_${BUILD_DATE}_release.apk"
          ls -lh out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ github.sha }}
          path: out/*.apk
          retention-days: 30

      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build (${{ env.BUILD_DATE }})
          body: |
            Automatischer Build von `master` — Commit ${{ github.sha }}
            Stand: ${{ env.BUILD_DATE }}
          prerelease: true
          files: out/*.apk
