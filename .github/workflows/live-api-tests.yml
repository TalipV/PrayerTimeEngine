name: Live API tests

# The live-API tests hit real external services (Fazilet, Semerkand, Muwaqqit, Mawaqit,
# MyMosq, LocationIQ), so they are non-deterministic and must NOT gate pushes or the APK
# release. They run on a schedule (and on demand) to surface outages and breaking
# changes on the provider side, decoupled from feature work.
on:
  schedule:
    # Twice a day (00:00 and 12:00 UTC). GitHub starts scheduled runs late under load (observed:
    # 5-7 hours), so a fixed evening slot isn't reliable; two runs 12 hours apart still surface an
    # outage within the same day, before the app has to fetch the next day's data at midnight
    # (Fazilet only ever delivers up to tomorrow).
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # SDK version is pinned in global.json, so CI and local builds use the same SDK.
          global-json-file: global.json

      # global.json pins sdk.workloadVersion; the SDK refuses to evaluate any project
      # until that workload set is installed, even projects that use no workloads.
      - name: Install workload set from global.json
        run: dotnet workload update

      - name: Run live API tests
        run: >
          dotnet test tests/PrayerTimeEngine.Core.Tests.Live/PrayerTimeEngine.Core.Tests.Live.csproj
          -c Release --logger "trx;LogFileName=live.trx" --results-directory TestResults

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Live API tests
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-test-results-${{ github.sha }}
          path: TestResults/*.trx
          retention-days: 30
